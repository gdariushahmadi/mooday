# DANEG reverse proxy for app.daneg.ae. The previous newapp.daneg.ae
# hostname redirects to the canonical domain with its own valid certificate.
# Next.js owns the application pages and /api/*.
# Kong owns only the Supabase API paths under /auth/v1, /rest/v1, and
# /storage/v1. The OAuth callback is a Next.js page and must not go to Kong.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mooday_kong {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream mooday_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name newapp.daneg.ae;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://app.daneg.ae$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name newapp.daneg.ae;

    ssl_certificate /etc/letsencrypt/live/newapp.daneg.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newapp.daneg.ae/privkey.pem;

    return 301 https://app.daneg.ae$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.daneg.ae;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.daneg.ae;

    ssl_certificate /etc/letsencrypt/live/app.daneg.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.daneg.ae/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    # OAuth callback is rendered by Next.js. Keep it before the Kong paths.
    location = /auth/callback {
        proxy_pass http://mooday_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    # Supabase API surface through Kong.
    location /auth/v1/ {
        proxy_pass http://mooday_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /rest/v1/ {
        proxy_pass http://mooday_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /storage/v1/ {
        proxy_pass http://mooday_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header content-disposition;
    }
    # Realtime is a WebSocket endpoint: without the 1.1 upgrade headers
    # nginx answers the handshake with a plain HTTP response and the
    # browser reports "WebSocket connection failed".
    location /realtime/v1/ {
        proxy_pass http://mooday_kong;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /pg/ {
        proxy_pass http://mooday_kong;
    }
    location /functions/v1/ {
        proxy_pass http://mooday_kong;
    }
    location /graphql {
        proxy_pass http://mooday_kong;
    }

    # Next.js application pages and server routes.
    location /api/ {
        proxy_pass http://mooday_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://mooday_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
